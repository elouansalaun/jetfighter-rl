name: 8_6_heading_altitude
env:
  task: heading_altitude
  model: 6dof
  action_mode: low_level
  agent_dt: 0.02
  control_dt: 0.02
  attitude_features: gravity
  nz_neutral: compensated
  action_exponent: 1.0
algo: ppo
total_timesteps: 5000000
n_envs: 8
seeds:
- 0
hyperparams:
  n_steps: 2048
  batch_size: 2048
  learning_rate: 3.0e-05
  lr_final: 1.0e-05
  clip_range: 0.1
  gamma: 0.998
  gae_lambda: 0.99
  policy_kwargs:
    net_arch:
    - 256
    - 256
    log_std_init: -3.5
eval:
  freq: 250000
  episodes: 10
init_from: null
normalize_reward: true
pretrain:
  episodes: 40
  noise: 0.05
  epochs: 30
  critic_warmup: 5
description: heading_altitude en commande directe des gouvernes (6-DOF, 50 Hz), imitation
  puis PPO

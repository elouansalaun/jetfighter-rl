# 8.6 — Passage au bas niveau : « level » sur le 6-DOF, l'agent commande directement
# manette, profondeur, ailerons et direction (plus de commandes de vol pour le protéger).
# Cadence 50 Hz (les commandes de vol de référence ne tiennent pas à 10 Hz). Démarrage par
# imitation de « pilote auto + commandes de vol », critique seul, puis PPO prudent.
# Critère de la roadmap : ≥ 90 % des performances de l'agent hiérarchique, sans dépasser
# les limites structurales (pénalités overload/sideslip ajoutées en bas niveau).
name: 8_6_level
description: level en commande directe des gouvernes (6-DOF, 50 Hz), imitation puis PPO
env:
  task: level
  model: 6dof
  action_mode: low_level
  agent_dt: 0.02
  control_dt: 0.02
algo: ppo
total_timesteps: 5000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 2048
  batch_size: 2048
  learning_rate: 3.0e-5
  lr_final: 1.0e-5
  clip_range: 0.1
  gamma: 0.998          # horizon ≈ 10 s à 50 Hz, comme γ = 0.99 à 10 Hz
  gae_lambda: 0.99      # à 50 Hz, λ = 0.95 ne « voit » que 0.4 s : PPO dégradait la politique imitée
  policy_kwargs: {net_arch: [256, 256], log_std_init: -3.5}   # bruit ≈ 0.7° de profondeur (σ = 0.14 : 3.5°, trop)
eval: {freq: 250000, episodes: 10}
init_from: null
pretrain: {episodes: 40, noise: 0.05, epochs: 30, critic_warmup: 5}

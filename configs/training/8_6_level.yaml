# 8.6 — Switch to low-level: "level" on the 6-DOF, the agent directly commands
# throttle, elevator, ailerons and rudder (no more fly-by-wire to protect it).
# 50 Hz rate (the reference fly-by-wire does not hold at 10 Hz). Warm start by
# imitation of "autopilot + fly-by-wire", critic only, then cautious PPO.
# Roadmap criterion: ≥ 90 % of the hierarchical agent's performance, without exceeding
# structural limits (overload/sideslip penalties added in low-level mode).
name: 8_6_level
description: level with direct control-surface commands (6-DOF, 50 Hz), imitation then PPO
env:
  task: level
  model: 6dof
  action_mode: low_level
  agent_dt: 0.02
  control_dt: 0.02
algo: ppo
total_timesteps: 5000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 2048
  batch_size: 2048
  learning_rate: 3.0e-5
  lr_final: 1.0e-5
  clip_range: 0.1
  gamma: 0.998          # horizon ≈ 10 s at 50 Hz, like γ = 0.99 at 10 Hz
  gae_lambda: 0.99      # at 50 Hz, λ = 0.95 only "sees" 0.4 s: PPO degraded the imitated policy
  policy_kwargs: {net_arch: [256, 256], log_std_init: -3.5}   # noise ≈ 0.7° of elevator (σ = 0.14: 3.5°, too much)
eval: {freq: 250000, episodes: 10}
init_from: null
pretrain: {episodes: 40, noise: 0.05, epochs: 30, critic_warmup: 5}

# 8.3 — Coordinated turn at maximum sustained rate (criterion: ≥ 90 % of the optimal rate,
# without energy or altitude loss)
name: 8_3_sustained_turn
description: Optimal sustained turn (3-DOF, hierarchical)
env:
  task: sustained_turn
  model: 3dof
  action_mode: hierarchical
algo: ppo
total_timesteps: 3000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 1024
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_final: 3.0e-5   # linear decay: more stable end of training (cf. 8.2)
  gamma: 0.99
eval: {freq: 100000, episodes: 10}
init_from: 8_1_level   # curriculum: avoids early crashes (recovery already learned)
# Option: start from an imitation of the reference (autopilot / scripted pilot), then RL.
# pretrain: {episodes: 40, noise: 0.1, epochs: 30, critic_warmup: 5}

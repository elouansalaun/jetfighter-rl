# 8.4 — Following 4 3D waypoints (criterion: all passed)
name: 8_4_waypoints
description: Chain of 3D waypoints (3-DOF, hierarchical)
env:
  task: waypoints
  model: 3dof
  action_mode: hierarchical
algo: ppo
total_timesteps: 5000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 1024
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_final: 3.0e-5   # linear decay: more stable end of training (cf. 8.2)
  gamma: 0.995        # longer horizon: a waypoint is 20–40 s away
eval: {freq: 250000, episodes: 10}
init_from: 8_2_heading_altitude   # curriculum: heading and altitude hold already learned
# Option: start from an imitation of the reference (autopilot / scripted pilot), then RL.
# pretrain: {episodes: 40, noise: 0.1, epochs: 30, critic_warmup: 5}

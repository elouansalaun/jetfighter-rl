# 8.4 — Suivi de 4 points de passage 3D (critère : tous franchis)
name: 8_4_waypoints
description: Enchaînement de points de passage 3D (3-DOF, hiérarchique)
env:
  task: waypoints
  model: 3dof
  action_mode: hierarchical
algo: ppo
total_timesteps: 5000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 1024
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_final: 3.0e-5   # décroissance linéaire : fin d'entraînement plus stable (cf. 8.2)
  gamma: 0.995        # horizon plus long : un point de passage est à 20–40 s
eval: {freq: 250000, episodes: 10}
init_from: 8_2_heading_altitude   # curriculum : tenue de cap et d'altitude déjà apprise
# Option : partir d'une imitation de la référence (pilote auto / pilote scripté), puis RL.
# pretrain: {episodes: 40, noise: 0.1, epochs: 30, critic_warmup: 5}

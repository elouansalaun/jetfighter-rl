# 8.5 — Voltige : looping, tonneau, Immelmann, Split-S (une seule politique, figure tirée
# au hasard et indiquée dans l'observation). Critère : figure complète puis ailes à plat.
name: 8_5_aerobatics
description: Looping, tonneau, Immelmann et Split-S (3-DOF, hiérarchique)
env:
  task: aerobatics
  model: 3dof
  action_mode: hierarchical
  task_kwargs:
    maneuvers: [loop, roll, immelmann, split_s]
algo: ppo
total_timesteps: 5000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 1024
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_final: 3.0e-5   # décroissance linéaire : fin d'entraînement plus stable (cf. 8.2)
  gamma: 0.995
  policy_kwargs: {net_arch: [256, 256]}
eval: {freq: 250000, episodes: 20}
init_from: null   # réseau plus grand (256×256) : le transfert depuis 8.1 ne copiait presque rien
# Option : partir d'une imitation de la référence (pilote auto / pilote scripté), puis RL.
# pretrain: {episodes: 40, noise: 0.1, epochs: 30, critic_warmup: 5}

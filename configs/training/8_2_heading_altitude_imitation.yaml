# 8.2 variant: imitation of the autopilot (DART, 40 episodes), critic trained alone
# for 5 rollouts, then cautious PPO (reduced learning rate, small noise).
# Rationale: PPO alone is too erratic on 8.2 (3 runs on the Mac: 90 %, 60 %, 20 %
# success for the best model); imitation starts right away at the reference's level.
name: 8_2_heading_altitude_imitation
description: Heading / altitude / speed, imitation of the reference then PPO (3-DOF)
env:
  task: heading_altitude
  model: 3dof
  action_mode: hierarchical
algo: ppo
total_timesteps: 1000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 1024
  batch_size: 1024
  learning_rate: 5.0e-5
  lr_final: 1.0e-5
  clip_range: 0.1
  gamma: 0.99
  policy_kwargs: {log_std_init: -2.0}
eval: {freq: 50000, episodes: 10}
init_from: null
pretrain: {episodes: 40, noise: 0.1, epochs: 30, critic_warmup: 5}

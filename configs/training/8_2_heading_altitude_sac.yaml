# SAC variant of 8.2 (more sample-efficient on continuous actions, slower in
# compute time per step) — to compare algorithms.
name: 8_2_heading_altitude_sac
description: Heading / altitude / speed with SAC (3-DOF, hierarchical)
env:
  task: heading_altitude
  model: 3dof
  action_mode: hierarchical
algo: sac
total_timesteps: 300000
n_envs: 4
seeds: [0, 1, 2]
hyperparams:
  learning_starts: 10000
  batch_size: 256
  gamma: 0.99
eval: {freq: 25000, episodes: 10}
init_from: null

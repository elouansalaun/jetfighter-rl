# Full phase 8 curriculum in hierarchical mode: each task first in 3-DOF,
# then transferred to the 6-DOF (init_from: same task in 3-DOF, full weight copy).
# Run: python scripts/run_curriculum.py configs/training/curriculum.yaml
# Indicative duration on 8 cores (≈ 3,000–4,000 steps/s in 3-DOF, 4 times fewer in 6-DOF):
# about ten hours for 3 seeds — run it overnight, or --seeds 0 for a first try.
stages:
  - config: 8_1_level.yaml
  - config: 8_1_level.yaml
    model: 6dof
    init_from: 8_1_level
    timesteps: 1000000   # 200,000 was not enough: the 3-DOF agent oscillated in roll
  # 8.2 and 8.5: start from imitation of the reference (pure RL too erratic on 8.2, and
  # unable to discover the loop, Immelmann and Split-S on 8.5)
  - config: 8_2_heading_altitude_imitation.yaml
  - config: 8_2_heading_altitude_imitation.yaml
    model: 6dof
    init_from: 8_2_heading_altitude_imitation
    timesteps: 1000000
  - config: 8_3_sustained_turn.yaml
  - config: 8_3_sustained_turn.yaml
    model: 6dof
    init_from: 8_3_sustained_turn
    timesteps: 1000000
  - config: 8_4_waypoints.yaml
    init_from: 8_2_heading_altitude_imitation
  - config: 8_4_waypoints.yaml
    model: 6dof
    init_from: 8_4_waypoints
    timesteps: 3000000   # 1.5 M: still 10–40 % crashes
  - config: 8_5_aerobatics_imitation.yaml
  - config: 8_5_aerobatics_imitation.yaml
    model: 6dof
    init_from: 8_5_aerobatics_imitation
    timesteps: 1500000

# 8.1 — Stabilization from a perturbed attitude (criterion: back to level flight < 10 s)
name: 8_1_level
description: Unusual-attitude recovery -> wings-level cruise (3-DOF, hierarchical)
env:
  task: level
  model: 3dof
  action_mode: hierarchical
algo: ppo
total_timesteps: 200000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 512
  batch_size: 512
  learning_rate: 3.0e-4
  gamma: 0.99
eval: {freq: 20000, episodes: 10}
init_from: null

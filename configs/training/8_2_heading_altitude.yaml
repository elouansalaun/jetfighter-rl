# 8.2 — Changement de cap, d'altitude et de vitesse (critère : erreur faible, pas de
# dépassement excessif). L'agent part de la politique de 8.1 (entrées communes copiées) :
# depuis zéro, les premiers essais piquaient au sol pendant plus de 150 000 pas.
name: 8_2_heading_altitude
description: Rallier un cap, une altitude et une vitesse tirés au hasard (3-DOF, hiérarchique)
env:
  task: heading_altitude
  model: 3dof
  action_mode: hierarchical
algo: ppo
total_timesteps: 3000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 1024
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_final: 3.0e-5   # décroissance linéaire : la 2e exécution de 8.2 oscillait entre 0 et 60 % de réussite en fin d'entraînement
  gamma: 0.99
eval: {freq: 100000, episodes: 10}
init_from: 8_1_level   # curriculum : part de la politique de stabilisation (entrées communes)
# Option : partir d'une imitation de la référence (pilote auto / pilote scripté), puis RL.
# pretrain: {episodes: 40, noise: 0.1, epochs: 30, critic_warmup: 5}

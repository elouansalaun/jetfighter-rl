# 8.2 — Heading, altitude and speed change (criterion: small error, no excessive
# overshoot). The agent starts from the 8.1 policy (shared inputs copied):
# from scratch, the first attempts dived into the ground for more than 150,000 steps.
name: 8_2_heading_altitude
description: Reach a randomly drawn heading, altitude and speed (3-DOF, hierarchical)
env:
  task: heading_altitude
  model: 3dof
  action_mode: hierarchical
algo: ppo
total_timesteps: 3000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 1024
  batch_size: 1024
  learning_rate: 3.0e-4
  lr_final: 3.0e-5   # linear decay: the 2nd run of 8.2 oscillated between 0 and 60 % success at the end of training
  gamma: 0.99
eval: {freq: 100000, episodes: 10}
init_from: 8_1_level   # curriculum: starts from the stabilization policy (shared inputs)
# Option: start from an imitation of the reference (autopilot / scripted pilot), then RL.
# pretrain: {episodes: 40, noise: 0.1, epochs: 30, critic_warmup: 5}

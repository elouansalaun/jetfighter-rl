# Variante de 8.5 : imitation du pilote scripté (les quatre figures), critique entraîné
# seul pendant 5 collectes, puis PPO prudent. La voltige est le cas typique où partir de
# démonstrations aide : il faut enchaîner 20 s de commandes cohérentes avant la première
# récompense de fin de figure.
name: 8_5_aerobatics_imitation
description: Voltige, imitation du pilote scripté puis PPO (3-DOF, hiérarchique)
env:
  task: aerobatics
  model: 3dof
  action_mode: hierarchical
  task_kwargs:
    maneuvers: [loop, roll, immelmann, split_s]
algo: ppo
total_timesteps: 3000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 1024
  batch_size: 1024
  learning_rate: 5.0e-5
  clip_range: 0.1
  gamma: 0.995
  policy_kwargs: {net_arch: [256, 256], log_std_init: -2.0}
eval: {freq: 100000, episodes: 20}
init_from: null
pretrain: {episodes: 80, noise: 0.1, epochs: 30, critic_warmup: 5}

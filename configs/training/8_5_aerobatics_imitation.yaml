# 8.5 variant: imitation of the scripted pilot (all four maneuvers), critic trained alone
# for 5 rollouts, then cautious PPO. Aerobatics is the typical case where starting from
# demonstrations helps: 20 s of consistent commands are needed before the first
# end-of-maneuver reward.
name: 8_5_aerobatics_imitation
description: Aerobatics, imitation of the scripted pilot then PPO (3-DOF, hierarchical)
env:
  task: aerobatics
  model: 3dof
  action_mode: hierarchical
  task_kwargs:
    maneuvers: [loop, roll, immelmann, split_s]
algo: ppo
total_timesteps: 3000000
n_envs: 8
seeds: [0, 1, 2]
hyperparams:
  n_steps: 1024
  batch_size: 1024
  learning_rate: 5.0e-5
  clip_range: 0.1
  gamma: 0.995
  policy_kwargs: {net_arch: [256, 256], log_std_init: -2.0}
eval: {freq: 100000, episodes: 20}
init_from: null
pretrain: {episodes: 80, noise: 0.1, epochs: 30, critic_warmup: 5}

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jetfighter-rl"
version = "0.1.0"
description = "Reinforcement learning of fighter-jet maneuvers (Gymnasium + PPO) on top of the jetsim F-16 flight simulator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elouan Salaun" }]
keywords = ["reinforcement-learning", "ppo", "gymnasium", "flight-control", "f-16", "imitation-learning"]
dependencies = [
    # flight simulator (phases 1 to 6), separate repository
    "jetsim @ git+https://github.com/elouansalaun/jetfighter-sim.git@v0.1.0",
    "gymnasium>=0.29",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "tensorboard>=2.16",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
notebooks = [
    "jupyterlab>=4.0",
]

[project.urls]
Repository = "https://github.com/elouansalaun/jetfighter-rl"
Simulator = "https://github.com/elouansalaun/jetfighter-sim"

[tool.hatch.metadata]
allow-direct-references = true  # git dependency on jetsim

[tool.hatch.build.targets.wheel]
packages = ["src/jetfighter_rl"]

# --------------------------------------------------------------------------
# Tools
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY", "RUF"]
ignore = [
    "N802", "N803", "N806",  # physics notation: T, P, C_bn, Ixx...
    "RUF001", "RUF002", "RUF003",  # Greek letters / special characters in docstrings
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["jetfighter_rl"]
known-third-party = ["jetsim"]
